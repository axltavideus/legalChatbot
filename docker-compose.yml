# ==============================================================================
# LexIndo — Docker Compose Production Stack
# 1. Backend (FastAPI, SQLite, ChromaDB, Auto-seed on startup, /health)
# 2. Frontend (Next.js 14 Standalone with internal /api/* proxy rewrites)
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lexindo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/lexindo.db
      - CHROMA_PATH=/app/data/chroma_db
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-gemini}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-models/text-embedding-004}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MOCK_LLM=${MOCK_LLM:-true}
      - SECRET_KEY=${SECRET_KEY:-lexindo-production-secret-jwt-key-2026}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - ADMIN_INVITE_CODE=${ADMIN_INVITE_CODE:-ADMIN2025}
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost","http://frontend:3000"]
    volumes:
      - lexindo_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://backend:8000
    container_name: lexindo-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  lexindo_data:
    name: lexindo_data

