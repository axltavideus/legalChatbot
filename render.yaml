# ==============================================================================
# Render Blueprint — Deploy LexIndo Backend API
# https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: lexindo-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./lexindo.db
      - key: CHROMA_PATH
        value: ./chroma_db
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_EMBEDDING_MODEL
        value: models/text-embedding-004
      - key: MOCK_LLM
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_INVITE_CODE
        value: ADMIN2025
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: GEMINI_API_KEY
        sync: false

